<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>认识智慧农业 · 随堂测试</title>
    <style>
        /* ===== 全局 & 颜色 ===== */
        :root {
            --paper: #f3ead6;
            --sheet: #fffaf0;
            --rule: #d8cbb0;
            --ink: #1f1a14;
            --ink-soft: #5c5348;
            --olive: #3d5346;
            --olive-deep: #2a3b32;
            --ok: #067833;
            --ok-bg: #d4f0dc;
            --bad: #c9857f;
            --bad-bg: #fbe9e7;
            --mark: #c45c2a;
        }

        * { box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            margin: 0;
            color: var(--ink);
            background: radial-gradient(ellipse at 50% 0%, #f7efdc, var(--paper) 55%);
            font-family: "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", sans-serif;
            line-height: 1.6;
        }

        .wrap {
            width: min(680px, calc(100% - 28px));
            margin: 28px auto 64px;
        }

        .sheet {
            background: var(--sheet);
            border: 1px solid #cfc1a4;
            box-shadow: 0 1px 0 #fff8ea inset, 0 14px 36px rgba(70, 52, 24, .08);
            border-radius: 4px;
            overflow: hidden;
        }

        .masthead {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 12px;
            align-items: end;
            padding: 22px 28px 16px;
            border-bottom: 3px double var(--olive-deep);
        }
        .kicker {
            margin: 0;
            color: var(--olive);
            font-size: 12px;
            letter-spacing: .08em;
        }
        h1 {
            margin: 4px 0 0;
            font-family: "Songti SC", "STSong", "Noto Serif SC", "Source Han Serif SC", serif;
            font-size: 30px;
            font-weight: 700;
            letter-spacing: .04em;
            line-height: 1.2;
        }
        .stamp {
            align-self: start;
            padding: 6px 9px 5px;
            color: var(--mark);
            font-family: "Kaiti SC", "STKaiti", "KaiTi", serif;
            font-size: 15px;
            border: 1.5px solid var(--mark);
            transform: rotate(8deg);
            opacity: .85;
        }

        .meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            padding: 10px 28px;
            color: var(--ink-soft);
            font-size: 13px;
            border-bottom: 1px solid var(--rule);
            background: #f7f0de;
            flex-wrap: wrap;
        }
        .meta .info-tag {
            display: flex;
            gap: 14px;
            flex-wrap: wrap;
        }
        .meta .info-tag span {
            background: #ede6d4;
            padding: 0 10px;
            border-radius: 12px;
            font-size: 12px;
        }
        .track {
            display: flex;
            gap: 6px;
            align-items: center;
        }
        .dot {
            width: 9px;
            height: 9px;
            border: 1px solid var(--olive);
            background: transparent;
            border-radius: 50%;
            transition: background .2s;
        }
        .dot.done { background: var(--olive); }
        .dot.now { background: #e8c36a; border-color: #b0892a; }
        .dot.submitted-dot { background: var(--ok); border-color: var(--ok); opacity: .5; }

        .stage {
            padding: 26px 28px 28px;
            min-height: 400px;
        }

        /* ===== 信息填写 ===== */
        .info-form {
            max-width: 440px;
            margin: 0 auto;
        }
        .info-form .field {
            margin-bottom: 18px;
        }
        .info-form label {
            display: block;
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 4px;
            color: var(--olive-deep);
        }
        .info-form input {
            width: 100%;
            padding: 10px 14px;
            font-size: 16px;
            border: 1px solid var(--rule);
            border-radius: 4px;
            background: #fffcf5;
            font-family: inherit;
            transition: border .2s;
        }
        .info-form input:focus {
            outline: none;
            border-color: var(--olive);
            box-shadow: 0 0 0 3px rgba(61, 83, 70, .15);
        }
        .info-form .btn-start {
            width: 100%;
            padding: 12px;
            font-size: 18px;
            font-weight: 700;
            color: #fff;
            background: var(--olive-deep);
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background .2s;
            margin-top: 6px;
        }
        .info-form .btn-start:hover {
            background: var(--olive);
        }
        .info-form .btn-start:disabled {
            opacity: .4;
            cursor: not-allowed;
        }
        .info-form .hint {
            font-size: 13px;
            color: var(--ink-soft);
            margin-top: 6px;
            text-align: center;
        }

        /* ===== 题目 ===== */
        .q-label {
            margin: 0 0 8px;
            color: var(--olive);
            font-size: 13px;
            font-weight: 600;
        }
        .stem {
            margin: 0 0 20px;
            font-size: 18px;
            font-weight: 600;
            line-height: 1.55;
        }
        .choices {
            display: grid;
            gap: 8px;
        }
        .choice {
            width: 100%;
            display: grid;
            grid-template-columns: 28px 1fr auto;
            gap: 10px;
            align-items: start;
            padding: 11px 12px;
            color: inherit;
            text-align: left;
            font: inherit;
            background: #fff;
            border: 1px solid #d7ccb6;
            border-radius: 4px;
            cursor: pointer;
            transition: border .15s, background .15s;
        }
        .choice:hover:not(:disabled) {
            border-color: var(--olive);
            background: #fbf7ec;
        }
        .choice:focus-visible {
            outline: 2px solid var(--olive);
            outline-offset: 2px;
        }
        .choice:disabled { cursor: default; }
        .choice .mark {
            width: 22px;
            height: 22px;
            display: grid;
            place-items: center;
            margin-top: 1px;
            font-size: 12px;
            font-weight: 700;
            color: var(--olive-deep);
            background: #fff;
            border: 1px solid currentColor;
            border-radius: 50%;
            flex-shrink: 0;
        }
        .choice.selected-exam {
            border-color: var(--olive);
            background: #edf3e8;
        }
        .choice.selected-exam .mark {
            background: var(--olive);
            color: #fff;
            border-color: var(--olive);
        }

        /* ===== 提交后界面 ===== */
        .result-box {
            text-align: center;
            padding: 12px 0 6px;
        }
        .result-box .big-score {
            font-family: "Songti SC", "STSong", serif;
            font-size: 64px;
            line-height: 1;
            font-weight: 700;
            color: var(--olive-deep);
        }
        .result-box .sub-info {
            font-size: 15px;
            color: var(--ink-soft);
            margin: 8px 0 4px;
        }
        .result-box .sub-info strong { color: var(--ink); }

        .banner {
            margin-top: 18px;
            padding: 14px 18px;
            border-radius: 4px;
            border-left: 4px solid var(--olive);
            background: #f0f5ea;
            color: var(--olive-deep);
            font-size: 14px;
        }
        .banner.bad {
            border-left-color: var(--bad);
            background: var(--bad-bg);
            color: #6b3d3a;
        }
        .banner strong {
            display: block;
            font-size: 16px;
            margin-bottom: 4px;
        }

        /* ===== 按钮 ===== */
        .nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-top: 22px;
            flex-wrap: wrap;
        }
        .nav.center { justify-content: center; }
        .btn {
            padding: 8px 20px;
            color: var(--sheet);
            font: inherit;
            font-weight: 600;
            background: var(--olive-deep);
            border: 1px solid var(--olive-deep);
            border-radius: 4px;
            cursor: pointer;
            transition: background .2s, opacity .2s;
        }
        .btn:hover:not(:disabled) { background: var(--olive); }
        .btn:disabled { opacity: .38; cursor: not-allowed; }
        .btn.ghost {
            color: var(--olive-deep);
            background: transparent;
            border-color: var(--rule);
        }
        .btn.ghost:hover:not(:disabled) {
            background: #efe6d0;
            border-color: var(--olive);
        }
        .btn.submit-btn {
            background: #1a6b3c;
            border-color: #1a6b3c;
        }
        .btn.submit-btn:hover:not(:disabled) { background: #0f522d; }

        .foot {
            padding: 10px 28px 16px;
            color: #8a8070;
            font-size: 12px;
            border-top: 1px solid var(--rule);
            background: #faf7ef;
        }

        /* ===== 响应式 ===== */
        @media (max-width: 560px) {
            .wrap { width: min(100% - 16px, 680px); margin-top: 12px; }
            .masthead, .meta, .stage, .foot { padding-left: 16px; padding-right: 16px; }
            h1 { font-size: 24px; }
            .stem { font-size: 17px; }
            .stamp { display: none; }
            .result-box .big-score { font-size: 48px; }
            .info-form { max-width: 100%; }
            .meta .info-tag span { font-size: 11px; padding: 0 8px; }
        }
    </style>
</head>
<body>

<div class="wrap">
    <article class="sheet" id="app">
        <!-- ===== 头部 ===== -->
        <header class="masthead">
            <div>
                <p class="kicker">八年级上册 · 第一单元第 1 课</p>
                <h1>认识智慧农业</h1>
            </div>
            <div class="stamp">随堂测试</div>
        </header>

        <!-- ===== 元信息栏 ===== -->
        <div class="meta" id="metaBar">
            <div class="info-tag" id="infoTags">
                <span id="studentDisplay">⏳ 请先填写信息</span>
            </div>
            <div class="track" id="track" aria-hidden="true"></div>
        </div>

        <!-- ===== 主体 ===== -->
        <section class="stage" id="stage" aria-live="polite"></section>

        <!-- ===== 底部 ===== -->
        <p class="foot" id="footerNote">教育科学出版社《信息科技》 · 独立完成，诚信作答。</p>
    </article>
</div>

<script>
    // ============================================================
    //  数据
    // ============================================================
    const QUESTIONS = [{
        title: "下列关于物联网的说法，正确的是（　　）。",
        options: [
            "物联网是人与人进行交流的网络",
            "物联网是实现物与物、物与人相互连接的网络",
            "物联网只能连接计算机和手机",
            "物联网不需要借助互联网等网络传输信息"
        ],
        answer: 1,
        explanations: [
            "人与人交流是传统互联网的应用，不是物联网。",
            "物联网实现物与物、物与人的连接，是“万物互联”的基础。",
            "物联网可连接各种智能设备，不仅限于计算机和手机。",
            "物联网依赖互联网等网络进行数据传输。"
        ]
    }, {
        title: "与传统农业相比，智慧农业最突出的特征是（　　）。",
        options: [
            "完全不需要农业生产设备",
            "只能依靠农民的经验进行管理",
            "能够利用数据实现农业生产的自动化、智能化和精准化",
            "所有农业生产活动都必须由人工现场完成"
        ],
        answer: 2,
        explanations: [
            "智慧农业仍需设备，只是更加智能化。",
            "智慧农业减少对经验的依赖，依靠数据分析。",
            "智慧农业通过数据驱动，实现自动化、智能化、精准化。",
            "智慧农业支持远程控制和自动执行，不强制人工现场。"
        ]
    }, {
        title: "某智慧温室利用土壤水分传感器采集数据。土壤缺水时，系统向农户发送提醒；农户查看历史湿度曲线后，通过云平台打开灌溉电磁阀。上述过程依次涉及的功能是（　　）。",
        options: [
            "实时监测、警告、数据查询、远程控制",
            "数据查询、实时监测、远程控制、警告",
            "远程控制、数据查询、警告、实时监测",
            "警告、远程控制、实时监测、数据查询"
        ],
        answer: 0,
        explanations: [
            "传感器采集数据是实时监测；发送提醒是警告；查看历史曲线是数据查询；打开电磁阀是远程控制。",
            "顺序错误。",
            "顺序错误。",
            "顺序错误。"
        ]
    }, {
        title: "下列应用中，不属于物联网应用的是（　　）。",
        options: [
            "智能手环自动记录心率，并将数据同步到手机",
            "智能路灯根据环境亮度自动开启或关闭",
            "农业传感器采集土壤水分并上传至云平台",
            "学生在电脑中输入文字，制作一份电子文档"
        ],
        answer: 3,
        explanations: [
            "智能手环是典型的物联网设备。",
            "智能路灯通过传感器和网络自动控制，属于物联网。",
            "农业传感器采集上传数据，是物联网应用。",
            "在电脑上编辑文档是传统计算应用，未涉及物与网的连接。"
        ]
    }, {
        title: "下列关于互联网与物联网区别的说法，正确的是（　　）。",
        options: [
            "互联网主要连接人与信息，物联网还可以连接物与物、物与人",
            "互联网可以传输信息，物联网不能传输信息",
            "互联网必须使用传感器，物联网不需要使用传感器",
            "物联网与互联网的连接对象和应用方式完全相同"
        ],
        answer: 0,
        explanations: [
            "互联网主要连接人，物联网延伸至物与物、物与人的连接。",
            "物联网也能传输信息。",
            "互联网不必须使用传感器，物联网常使用传感器。",
            "两者连接对象和应用方式不同。"
        ]
    }];

    const LETTERS = ["A", "B", "C", "D"];
    const API_URL = 'https://quickform.cn/api/cbb4omh8jq';

    // ============================================================
    //  内存状态（不持久化）
    // ============================================================
    let state = {
        student: { class: '', id: '', name: '' },
        currentAnswers: [],      // 当前考试的答案数组
        currentIndex: 0,         // 当前题目索引
        allDone: false,          // 是否已全部答完（进入待提交状态）
        submitted: false,
        submitTime: null,
        examScore: 0,
        mode: 'info'             // 'info' | 'exam' | 'submitConfirm' | 'submittedView'
    };

    // ============================================================
    //  持久化：仅存储提交记录（key = 班级_学号_姓名）
    // ============================================================
    function getSubmitKey(cls, id, name) {
        return `submitted_${cls}_${id}_${name}`;
    }

    function loadSubmitRecord(cls, id, name) {
        const key = getSubmitKey(cls, id, name);
        try {
            const raw = localStorage.getItem(key);
            if (!raw) return null;
            return JSON.parse(raw);
        } catch (_) { return null; }
    }

    function saveSubmitRecord(cls, id, name, score, time) {
        const key = getSubmitKey(cls, id, name);
        const record = { score, time };
        localStorage.setItem(key, JSON.stringify(record));
    }

    // ============================================================
    //  渲染引擎
    // ============================================================
    const stage = document.getElementById('stage');
    const track = document.getElementById('track');
    const studentDisplay = document.getElementById('studentDisplay');
    const footerNote = document.getElementById('footerNote');

    function render() {
        renderTrack();
        renderStudentInfo();

        switch (state.mode) {
            case 'info': renderInfoPage(); break;
            case 'exam': renderExamPage(); break;
            case 'submitConfirm': renderSubmitConfirmPage(); break;
            case 'submittedView': renderSubmittedView(); break;
            default: renderInfoPage();
        }
    }

    function renderTrack() {
        const total = QUESTIONS.length;
        let html = '';
        for (let i = 0; i < total; i++) {
            let cls = 'dot';
            if (state.mode === 'exam') {
                if (state.currentAnswers[i] !== undefined) cls += ' done';
                if (i === state.currentIndex) cls += ' now';
            }
            if (state.submitted) cls += ' submitted-dot';
            html += `<span class="${cls}"></span>`;
        }
        track.innerHTML = html;
    }

    function renderStudentInfo() {
        const s = state.student;
        if (s.name && s.class && s.id) {
            let status = '';
            if (state.submitted) status = ' ✅ 已提交';
            else if (state.allDone) status = ' 📝 待提交';
            else if (state.mode === 'exam' && state.currentAnswers.some(a => a !== undefined)) status = ' ⏳ 答题中';
            else status = ' 📋 未开始';
            studentDisplay.textContent = `${s.class} · ${s.name} (${s.id}) ${status}`;
        } else {
            studentDisplay.textContent = '⏳ 请先填写信息';
        }
    }

    // ============================================================
    //  页面：信息填写
    // ============================================================
    function renderInfoPage() {
        const s = state.student;
        stage.innerHTML = `
            <div class="info-form">
                <div style="text-align:center;margin-bottom:22px;">
                    <p style="font-size:15px;color:var(--ink-soft);">请填写个人信息后开始答题</p>
                </div>
                <div class="field">
                    <label for="f_class">班级（4位数字，如 2507）</label>
                    <input type="text" id="f_class" placeholder="2507" value="${escHtml(s.class)}" autocomplete="off">
                </div>
                <div class="field">
                    <label for="f_id">学号（2位数字，01-50）</label>
                    <input type="text" id="f_id" placeholder="01" value="${escHtml(s.id)}" autocomplete="off">
                </div>
                <div class="field">
                    <label for="f_name">姓名</label>
                    <input type="text" id="f_name" placeholder="你的姓名" value="${escHtml(s.name)}" autocomplete="off">
                </div>
                <button class="btn-start" id="btnStart">开始答题</button>
                <div class="hint">✏️ 请如实填写，提交后不可修改</div>
            </div>
        `;

        document.getElementById('btnStart').addEventListener('click', function() {
            const cls = document.getElementById('f_class').value.trim();
            const id = document.getElementById('f_id').value.trim();
            const name = document.getElementById('f_name').value.trim();

            if (!cls || !id || !name) {
                alert('请完整填写班级、学号和姓名。');
                return;
            }
            if (!/^\d{4}$/.test(cls)) {
                alert('班级格式错误，请输入四位数字，如 2507');
                return;
            }
            if (!/^(0[1-9]|[1-4][0-9]|50)$/.test(id)) {
                alert('学号格式错误，请输入两位数字（01-50），如 01');
                return;
            }

            // 检查是否已提交
            const record = loadSubmitRecord(cls, id, name);
            if (record) {
                state.student = { class: cls, id, name };
                state.submitted = true;
                state.submitTime = record.time;
                state.examScore = record.score;
                state.mode = 'submittedView';
                render();
                return;
            }

            // 未提交，进入考试模式（重置进度）
            state.student = { class: cls, id, name };
            state.currentAnswers = [];
            state.currentIndex = 0;
            state.allDone = false;
            state.submitted = false;
            state.submitTime = null;
            state.examScore = 0;
            state.mode = 'exam';
            render();
        });

        stage.querySelectorAll('input').forEach(inp => {
            inp.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') document.getElementById('btnStart').click();
            });
        });
    }

    // ============================================================
    //  页面：考试答题（可自由翻页修改）
    // ============================================================
    function renderExamPage() {
        const total = QUESTIONS.length;
        const idx = state.currentIndex;

        const q = QUESTIONS[idx];
        const picked = state.currentAnswers[idx] !== undefined ? state.currentAnswers[idx] : null;
        const isAnswered = picked !== null;
        const answeredCount = state.currentAnswers.filter(a => a !== undefined).length;
        state.allDone = answeredCount === total;

        let choicesHtml = q.options.map((text, i) => {
            let cls = 'choice';
            if (isAnswered && i === picked) cls += ' selected-exam';
            return `
                <button class="${cls}" type="button" data-opt="${i}">
                    <span class="mark">${LETTERS[i]}</span>
                    <span>${escHtml(text)}</span>
                </button>
            `;
        }).join('');

        stage.innerHTML = `
            <p class="q-label">第 ${idx + 1} 题 / 共 ${total} 题</p>
            <h2 class="stem">${escHtml(q.title)}</h2>
            <div class="choices">${choicesHtml}</div>
            <div class="nav">
                <button class="btn ghost" type="button" id="prevExam" ${idx === 0 ? 'disabled' : ''}>上一题</button>
                <button class="btn" type="button" id="nextExam" ${idx === total - 1 ? 'disabled' : ''}>下一题</button>
                <button class="btn submit-btn" type="button" id="openSubmit">📤 提交答卷</button>
            </div>
            <div style="margin-top:12px;text-align:center;font-size:13px;color:var(--ink-soft);">
                ${isAnswered ? '本题已选择，可继续修改　·　' : '本题尚未作答　·　'}已答 ${answeredCount} / ${total} 题
            </div>
        `;

        stage.querySelectorAll('.choice').forEach(btn => {
            btn.addEventListener('click', () => {
                const opt = Number(btn.dataset.opt);
                state.currentAnswers[idx] = opt;
                state.allDone = state.currentAnswers.filter(a => a !== undefined).length === total;
                renderExamPage();
            });
        });

        document.getElementById('prevExam').addEventListener('click', () => {
            if (idx > 0) { state.currentIndex = idx - 1; render(); }
        });

        document.getElementById('nextExam').addEventListener('click', () => {
            if (idx < total - 1) {
                state.currentIndex = idx + 1;
                render();
            }
        });

        document.getElementById('openSubmit').addEventListener('click', () => {
            state.allDone = state.currentAnswers.filter(a => a !== undefined).length === total;
            state.mode = 'submitConfirm';
            render();
        });

        // 键盘 1-4 选择
        const handler = (e) => {
            const num = parseInt(e.key);
            if (num >= 1 && num <= 4) {
                const btns = stage.querySelectorAll('.choice');
                if (btns[num - 1]) btns[num - 1].click();
            }
            if (e.key === 'Enter' && idx < total - 1) {
                document.getElementById('nextExam').click();
            }
        };
        if (window._examKeyHandler) {
            document.removeEventListener('keydown', window._examKeyHandler);
        }
        window._examKeyHandler = handler;
        document.addEventListener('keydown', handler);
    }

    // ============================================================
    //  页面：待提交确认（分数尚未计算）
    // ============================================================
    function renderSubmitConfirmPage() {
        const total = QUESTIONS.length;
        const answered = state.currentAnswers.filter(a => a !== undefined).length;
        const allAnswered = answered === total;

        stage.innerHTML = `
            <div style="text-align:center;padding:20px 0;">
                <p style="font-size:20px;font-weight:600;">${allAnswered ? '✅ 已完成所有题目' : '📝 提交前检查'}</p>
                <p style="font-size:15px;color:var(--ink-soft);margin-top:8px;">
                    你已作答 ${answered} / ${total} 题
                </p>
                <p style="font-size:14px;color:var(--ink-soft);margin-top:4px;">
                    ${allAnswered ? '请确认答案无误后，点击下方「提交」按钮。提交后才会计算分数并上传。' : '还有题目尚未作答，请返回答题页继续完成；提交前仍可自由修改所有答案。'}
                </p>
            </div>
            <div class="nav center" style="margin-top:12px;">
                <button class="btn ghost" type="button" id="backToExam">← 返回检查答案</button>
                <button class="btn submit-btn" type="button" id="submitFinal" ${allAnswered ? '' : 'disabled'}>📤 提交</button>
            </div>
        `;

        document.getElementById('backToExam').addEventListener('click', () => {
            state.mode = 'exam';
            const firstUnanswered = state.currentAnswers.findIndex(a => a === undefined);
            state.currentIndex = firstUnanswered >= 0 ? firstUnanswered : state.currentIndex;
            render();
        });

        document.getElementById('submitFinal').addEventListener('click', () => {
            if (!confirm('确认提交？提交后不可更改。')) return;
            doSubmitAndShowScore();
        });
    }

    // ============================================================
    //  提交并计算分数 + 显示结果
    // ============================================================
    async function doSubmitAndShowScore() {
        const btn = document.querySelector('#submitFinal');
        if (btn) { btn.disabled = true; btn.textContent = '⏳ 提交中...'; }

        try {
            const total = QUESTIONS.length;
            let correct = 0;
            for (let i = 0; i < total; i++) {
                if (state.currentAnswers[i] === QUESTIONS[i].answer) correct++;
            }
            const score = Math.round((correct / total) * 100);
            state.examScore = score;

            // 上传数据
            const payload = {
                class: state.student.class,
                studentId: state.student.id,
                name: state.student.name,
                answers: state.currentAnswers,
                score: score,
                total: total,
                correct: correct,
                submitTime: new Date().toISOString()
            };

            const resp = await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            if (!resp.ok) throw new Error(`HTTP ${resp.status}`);

            // 本地存储提交记录
            const now = new Date().toLocaleString('zh-CN');
            saveSubmitRecord(state.student.class, state.student.id, state.student.name, score, now);

            state.submitted = true;
            state.submitTime = now;
            state.mode = 'submittedView';

            // 显示成绩和提交成功
            render();
            alert('✅ 成绩提交成功！');

        } catch (err) {
            alert('❌ 提交失败，请检查网络后重试。\n' + err.message);
            if (btn) { btn.disabled = false; btn.textContent = '📤 提交'; }
        }
    }

    // ============================================================
    //  页面：已提交视图（显示成绩和时间）
    // ============================================================
    function renderSubmittedView() {
        const score = state.examScore;
        const total = QUESTIONS.length;
        const correct = Math.round((score / 100) * total);
        const passed = score >= 60;
        const emoji = score === 100 ? '🎉' : score >= 80 ? '👍' : score >= 60 ? '📖' : '💪';

        stage.innerHTML = `
            <div class="result-box">
                <div class="big-score">${score}</div>
                <div class="sub-info">答对 <strong>${correct}</strong> 题，答错 <strong>${total - correct}</strong> 题</div>
                <div class="sub-info" style="font-size:14px;margin-top:2px;">
                    ${emoji} ${score === 100 ? '全部答对，太棒了！' : score >= 80 ? '掌握得不错！' : score >= 60 ? '基本过关。' : '建议回顾课文内容。'}
                </div>
                <div style="margin-top:12px;">
                    <span style="font-size:13px;color:var(--ink-soft);">提交时间：${state.submitTime || '—'}</span>
                </div>
            </div>
            <div class="banner ${passed ? '' : 'bad'}">
                <strong>✅ 已提交</strong>
                <p>每位学生仅能提交一次，感谢你的参与。</p>
            </div>
        `;
        footerNote.textContent = '✅ 已提交 · 不可重复答题。';
    }

    // ============================================================
    //  工具
    // ============================================================
    function escHtml(str) {
        if (!str) return '';
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
    }

    // ============================================================
    //  初始化
    // ============================================================
    function init() {
        state.mode = 'info';
        state.submitted = false;
        state.currentAnswers = [];
        state.currentIndex = 0;
        state.allDone = false;
        render();
        footerNote.textContent = '教育科学出版社《信息科技》 · 独立完成，诚信作答。';
    }

    document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
