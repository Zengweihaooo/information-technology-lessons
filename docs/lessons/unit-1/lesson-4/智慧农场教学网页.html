 {id:'weather',role:'教师示范',nav:'气象环境监测站',icon:'☀',title:'旱情正在形成，怎样提前发现？',subtitle:'观察天气证据，搭建一套能发出旱情提醒的监测应用。',label:'农场西侧 · 气象环境监测站',sub:'连续晴热，近三日无有效降雨',situation:'过去三天持续晴热，雨量几乎为零。农场管理员想在作物明显萎蔫之前收到提醒。',question:'“天气热”足以判断旱情吗？还需要哪些可以持续采集的证据？',sensors:[['rain','☔','雨量传感器','记录降雨量'],['air','🌡','空气温湿度','记录气温与湿度'],['wind','🍃','风速传感器','记录风速'],['camera','📷','普通摄像头','只拍摄画面']],required:['rain'],network:[['lora','远距离采集网关','田间数据汇聚后上传'],['bluetooth','蓝牙直连教室','距离有限，不能覆盖农场']],networkOK:'lora',actions:[['alert','发布旱情预警','提醒管理员核查与安排灌溉'],['valve','立即打开所有阀门','没有核查田块与供水情况']],actionOK:'alert',fields:[{id:'rain',label:'近 24 小时雨量低于',unit:'mm',value:1,min:0,max:10,good:v=>v>=1&&v<=3},{id:'days',label:'连续少雨达到',unit:'天',value:3,min:1,max:5,good:v=>v>=2&&v<=4}],metrics:[['气温','34.6','℃',1],['24 h 雨量','0.2','mm',1],['空气湿度','26','%',1]],frames:[{time:'第1天',text:'气象站采集到气温 29℃、雨量 0.2 mm。',values:['29.0','0.2','42'],level:0},{time:'第2天',text:'气温升至 32℃，雨量没有增加。',values:['32.0','0.2','34'],level:1},{time:'第3天',text:'仍无有效降雨，少雨持续到第 3 天。',values:['34.6','0.2','26'],level:2},{time:'第3天',text:'平台发布旱情提醒；管理员收到田间核查任务。',values:['34.6','0.2','26'],level:3}],success:'平台根据连续低降雨与高温证据发出旱情提醒，并把后续田间核查交给管理员。',fail:'旱情监测链路没有形成有效预警。请检查传感器、传输和判断条件。',insight:'监测应用先把分散的天气数据变成预警，再结合田间情况决定是否灌溉。'},
 {id:'water',role:'学生任务 01',nav:'水肥灌溉设备',icon:'💧',title:'土壤缺水，为什么灌溉没有效果？',subtitle:'寻找供水异常，设计不会让水泵空转的水肥灌溉应用。',label:'番茄田 · 水肥灌溉区',sub:'土壤偏干，水箱水位突然下降',situation:'土壤水分降到 29%，管理员准备灌溉。但水箱水位突然跌至 12%，管道几乎没有水流。',question:'只看到“土壤很干”，就直接开启水泵，会发生什么？',sensors:[['soil','🌱','土壤水分探头','测量根区含水量'],['tank','🛢','水箱水位计','判断水源是否充足'],['flow','〰','管道流量计','核对是否真的出水'],['air','🌡','空气湿度计','不能代替土壤数据']],required:['tank'],network:[['edge','灌溉控制网关','汇集探头与阀门反馈'],['bluetooth','手机蓝牙临时连接','无法稳定远程控制']],networkOK:'edge',actions:[['protect','停泵并通知补水','避免空转，等待恢复供水'],['force','持续开启水泵','没有水源时仍强制运转']],actionOK:'protect',fields:[{id:'soil',label:'土壤水分低于',unit:'%',value:35,min:15,max:65,good:v=>v>=30&&v<=40},{id:'tank',label:'且水箱水位低于',unit:'%',value:20,min:5,max:70,good:v=>v>=15&&v<=25}],metrics:[['土壤水分','29','%',1],['水箱水位','12','%',1],['管道流量','0','L/min',1]],frames:[{time:'09:00',text:'土壤探头测得 38%，水箱水位 64%。',values:['38','64','8'],level:0},{time:'09:10',text:'土壤水分降至 33%，水箱仍有 42%。',values:['33','42','7'],level:1},{time:'09:20',text:'水箱水位突降至 12%，管道流量降为 0。',values:['29','12','0'],level:2},{time:'09:21',text:'平台停止水泵并发出补水与管路检查提醒。',values:['29','12','0'],level:3}],success:'系统辨认出供水不足，停止水泵并通知补水；流量反馈证明这不是一次有效灌溉。',fail:'系统未能安全处理供水中断。土壤缺水不代表水源充足，开泵命令也不代表田间真的得到水。',insight:'“土壤需要水”和“设备能够供水”是两个判断。水位与流量反馈能防止错误控制。'},
 {id:'pest',role:'学生任务 02',nav:'虫情测报设备',icon:'🦗',title:'蝗虫来袭，是误报还是虫害？',subtitle:'让虫情证据通过网络进入平台，形成分区核查与预警。',label:'农场东侧 · 虫情测报点',sub:'诱捕数量上升，图像出现疑似蝗虫',situation:'虫情测报点发现诱捕数量快速上升，摄像头识别出疑似蝗虫。平台需要提醒人员核查受影响的田块。',question:'一张模糊照片能直接决定全场喷药吗？',sensors:[['trap','🦗','虫情诱捕计数器','统计虫口数量'],['vision','📷','虫情识别摄像头','提供图像证据'],['wind','🍃','风向风速仪','辅助判断扩散方向'],['soil','🌱','土壤水分探头','与虫情无直接对应']],required:['trap'],network:[['cellular','田间 4G 网关','上传计数与虫情图像'],['bluetooth','本地蓝牙连接','远处管理人员无法及时接收']],networkOK:'cellular',actions:[['verify','分区预警并人工核查','确认虫种和范围后安排处置'],['spray','立刻全场自动喷药','证据不足且处置范围过大']],actionOK:'verify',fields:[{id:'count',label:'每小时诱捕数量达到',unit:'只',value:20,min:1,max:80,good:v=>v>=15&&v<=26},{id:'confidence',label:'且图像识别可信度达到',unit:'%',value:80,min:40,max:100,good:v=>v>=70&&v<=86}],metrics:[['每小时诱捕','26','只',1],['图像可信度','86','%',1],['风向','西南','',0]],frames:[{time:'14:00',text:'虫情计数器记录 7 只，图像未形成可靠识别。',values:['7','54','西南'],level:0},{time:'14:10',text:'诱捕数量增至 15 只，需要继续观察。',values:['15','68','西南'],level:1},{time:'14:20',text:'诱捕数量达到 26 只，图像可信度为 86%。',values:['26','86','西南'],level:2},{time:'14:21',text:'平台标记东侧田块，通知人员到场核查。',values:['26','86','西南'],level:3}],success:'虫情计数与图像证据共同触发分区预警，人员收到核查任务。',fail:'虫情证据未能形成可靠的核查任务。请检查测报设备、图像传输与处置方式。',insight:'虫情测报应用负责发现风险与组织核查；实际防治要依据确认后的虫种、范围和规范。'},
 {id:'greenhouse',role:'学生任务 03',nav:'大棚控制设备',icon:'🏡',title:'棚内又热又晒，怎样自动调节？',subtitle:'把环境传感器、网络和执行设备组成可验证的大棚控制系统。',label:'一号大棚 · 环境控制区',sub:'棚内高温强光，作物可能受热',situation:'正午棚内温度升至 35℃，光照强度达到 82 klx。管理员希望及时通风、遮阳，并确认设备确实动作。',question:'平台发出指令以后，凭什么确认大棚真的降温了？',sensors:[['temp','🌡','棚内温度传感器','持续测量空气温度'],['light','☀','光照度传感器','识别强光环境'],['feedback','⚙','设备状态反馈器','确认风机与遮阳幕动作'],['rain','☔','棚外雨量传感器','不能解释棚内强光高温']],required:['temp'],network:[['wifi','大棚控制网关','连接传感器与控制器'],['bluetooth','教室蓝牙直连','无法可靠连接现场设备']],networkOK:'wifi',actions:[['cool','开启风机并展开遮阳幕','通风与遮阳配合降温'],['close','关闭风机并收起遮阳幕','会增加高温强光风险']],actionOK:'cool',fields:[{id:'temp',label:'棚内温度高于',unit:'℃',value:32,min:20,max:45,good:v=>v>=30&&v<=34},{id:'light',label:'且光照强度高于',unit:'klx',value:70,min:20,max:100,good:v=>v>=65&&v<=80}],metrics:[['棚内温度','35','℃',1],['光照强度','82','klx',1],['风机状态','关闭','',1]],frames:[{time:'11:30',text:'棚内温度 29℃，光照 58 klx。',values:['29','58','关闭'],level:0},{time:'12:00',text:'温度升至 32℃，光照达到 72 klx。',values:['32','72','关闭'],level:1},{time:'12:20',text:'温度升至 35℃，光照达到 82 klx，规则触发。',values:['35','82','关闭'],level:2},{time:'12:30',text:'风机与遮阳幕反馈已动作，温度降至 31℃。',values:['31','61','开启'],level:3}],success:'平台下发控制指令后，设备状态反馈与后续温度变化共同证明调节有效。',fail:'大棚调节没有得到有效验证。请检查环境数据、网关、动作选择和设备反馈。',insight:'控制系统必须把“检测到高温”“发出指令”“设备动作”“环境改善”逐一核对。'}

const S={mission:0,stage:0,slots:{s0:null,network:null,action:null},thresholds:{},frame:-1,ran:false,success:false,exitField:'',exitRole:'',exitChecked:false,exitCorrect:false,completed:new Set(),playing:null};

function stopPlay(){if(S.playing){clearInterval(S.playing);S.playing=null}}
function reset(i=S.mission){stopPlay();S.mission=i;S.stage=0;S.slots={s0:null,network:null,action:null};S.exitField='';S.exitRole='';S.exitChecked=false;S.exitCorrect=false;S.thresholds=Object.fromEntries(M().fields.map(f=>[f.id,f.value]));S.frame=-1;S.ran=false;S.success=false;render()}
function clearRun(){stopPlay();S.frame=-1;S.ran=false;S.success=false;S.exitChecked=false;S.exitCorrect=false}
function chosenSensors(){return [S.slots.s0].filter(Boolean)}
function built(){let m=M();return chosenSensors().length===m.required.length&&m.required.every(x=>chosenSensors().includes(x))&&S.slots.network===m.networkOK}
function conditionAt(frame){
  const v=M().frames[frame].values,t=S.thresholds;
  if(M().id==='weather')return +v[1]<+t.rain&&[0,1,3][frame]>=+t.days;
  if(M().id==='water')return +v[0]<+t.soil&&+v[1]<+t.tank;
  if(M().id==='pest')return +v[0]>=+t.count&&+v[1]>=+t.confidence;
  return +v[0]>+t.temp&&+v[1]>+t.light;
}
function conditionGood(){return !conditionAt(0)&&!conditionAt(1)&&conditionAt(2)}
function ruleOK(){return S.slots.action===M().actionOK&&conditionGood()}
function diagnostic(){let m=M(),a=[],chosen=chosenSensors();for(let id of m.required)if(!chosen.includes(id))a.push('缺少'+m.sensors.find(x=>x[0]===id)[2]);for(let id of chosen)if(!m.required.includes(id))a.push('多选了'+m.sensors.find(x=>x[0]===id)[2]);if(S.slots.network!==m.networkOK)a.push('传输设备选错');if(S.slots.action!==m.actionOK)a.push('应用处置选错');if(conditionAt(0)||conditionAt(1))a.push('条件触发过早');else if(!conditionAt(2))a.push('突发时条件未触发');return a}

function toast(t){let e=$('toast');e.textContent=t;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),2300)}
function findItem(id){let m=M();return [...m.sensors,...m.network,...m.actions].find(x=>x[0]===id)}
function itemType(id){let m=M();return m.sensors.some(x=>x[0]===id)?'sensor':m.network.some(x=>x[0]===id)?'network':'action'}
function itemIcon(id){let m=M();return m.sensors.find(x=>x[0]===id)?.[1]||({lora:'📡',edge:'📡',cellular:'📡',wifi:'📡',bluetooth:'📱',alert:'🔔',valve:'🚿',protect:'⛔',force:'⚠',verify:'🔎',spray:'🧪',cool:'🌬',close:'🔒'}[id]||'⚙')}
function shortName(id){let n=findItem(id)?.[2]||'';return n.replace('传感器','').replace('探头','').replace('设备','').replace('并人工核查',' + 核查').replace('通知补水','补水提醒').replace('网关','网关')}
function place(id,slot){let type=itemType(id),need=slot.startsWith('s')?'sensor':slot;if(type!==need){toast('放错位置啦：请看槽位上的类型');return}if(type==='sensor')S.slots.s0=null;S.slots[slot]=id;clearRun();S.stage=built()?2:1;render()}
function autoPlace(id){let type=itemType(id),slot=type==='sensor'?'s0':type;place(id,slot)}
function step(n){S.stage=n;render()}
function renderNav(){$('nav').innerHTML=missions.map((m,i)=>`<button data-mission="${i}" class="${i===S.mission?'active':''}" aria-current="${i===S.mission?'page':'false'}">${m.icon} ${m.nav}${S.completed.has(i)?' ✓':''}</button>`).join('')}
function renderTitle(){let m=M();$('role').textContent=m.role;$('title').textContent=m.title;$('missionIcon').textContent=m.icon;$('site').textContent=m.label;$('siteSub').textContent=m.sub;let f=S.frame<0?2:S.frame,bubble=S.frame<0?'突发事件即将发生':S.frame===3?(S.success?'系统响应成功':'系统需要调整'):events[m.id][f];let e=$('eventBubble');e.textContent=bubble;e.className='event-bubble '+(S.frame===3&&S.success?'ok':'')}
function renderData(){let m=M(),f=S.frame<0?0:S.frame;if(f===3&&!S.success)f=2;let values=m.frames[f].values,word=moods[m.id][f],bar=bars[m.id][f];$('visualData').innerHTML=m.metrics.map((x,i)=>`<div class="data-card"><div class="line"><label>${x[0]}</label><small>${esc(values[i])}${x[2]}</small></div><strong>${word[i]}</strong><div class="meter"><i style="width:${bar[i]}%"></i></div></div>`).join('')}
function renderPath(){let m=M(),sensorNames=chosenSensors().map(id=>shortName(id)).join('＋')||'放入传感器',gateway=S.slots.network?shortName(S.slots.network):'放入网关',action=S.slots.action?shortName(S.slots.action):'选择处置';$('path').className='path layer-path '+(S.ran?'final':'');$('path').innerHTML=`<div class="layer sensing"><span class="layer-num">01</span><b>感知层</b><small>${esc(sensorNames)}</small></div><div class="layer-link ${chosenSensors().length?'live':''}"><i></i><span>数据</span></div><div class="layer transfer"><span class="layer-num">02</span><b>传输层</b><small>${esc(gateway)}</small></div><div class="layer-link ${S.slots.network?'live':''}"><i></i><span>上传</span></div><div class="layer application"><span class="layer-num">03</span><b>应用层</b><small>平台判断 → ${esc(action)}</small></div>`}

function renderPrompt(){let m=M(),f=S.frame,icon,title,txt;if(f===3){icon=S.success?'✅':'🔧';title=S.success?'做到了！':'再调整一下';txt=S.success?m.insight:diagnostic().slice(0,2).join(' · ')}else{icon=['👀','🧩','🎚','▶'][S.stage];title=['先看现场','拖动搭建','设定规则','运行验证'][S.stage];txt=S.stage===0?m.question:S.stage===1?'把设备卡片拖到对应槽位':S.stage===2?'滑动两条规则，再选处置设备':'逐步推进，观察现场变化'}$('promptIcon').textContent=icon;$('promptTitle').textContent=title;$('promptText').textContent=txt}
function renderSteps(){$('steps').innerHTML=['观察现场','每层选一','设定条件','运行·归纳'].map((x,i)=>`<button data-step="${i}" class="${S.stage===i?'active':S.stage>i?'done':''}">${i+1} ${x}</button>`).join('')}
function slotHtml(key,type){let id=S.slots[key],label=type==='sensor'?'感知':type==='network'?'传输':'处置';return `<button class="slot ${id?'filled':''}" data-slot="${key}" title="${id?'点击移除 '+findItem(id)[2]:'拖入'+label+'设备'}"><span class="slot-type">${label}</span><span class="slot-icon">${id?itemIcon(id):type==='sensor'?'＋':type==='network'?'📡':'⚡'}</span><span class="slot-text">${id?shortName(id):'拖到这里'}</span></button>`}
function renderAssembly(){let m=M();$('layerBuilder').innerHTML=`<div class="build-layer"><div class="build-label"><b>感知</b><small>选 1</small></div>${slotHtml('s0','sensor')}</div><div class="build-wire ${S.slots.s0?'live':''}"><i></i><em>数据</em></div><div class="build-layer"><div class="build-label"><b>传输</b><small>选 1</small></div>${slotHtml('network','network')}</div><div class="build-wire ${S.slots.network?'live':''}"><i></i><em>上传</em></div><div class="build-layer"><div class="build-label"><b>应用</b><small>选 1</small></div>${slotHtml('action','action')}</div>`;renderTelemetry()}
function renderTelemetry(){let m=M(),f=S.frame<0?0:S.frame;if(f===3&&!S.success)f=2;let vals=m.frames[f].values,order=m.id==='weather'?[1,0,2]:m.id==='water'?[1,0,2]:[0,1,2],widths=bars[m.id][f];$('telemetry').innerHTML=order.map((idx,pos)=>`<div class="tele-item ${pos===0?'primary':''}"><div class="tele-top"><b>${pos===0?'关键依据':'辅助观察'}</b><span class="tele-pulse"></span></div><strong>${m.metrics[idx][0]}</strong><div class="tele-reading"><span>${esc(vals[idx])}${m.metrics[idx][2]}</span><i style="--fill:${widths[idx]}%"></i></div></div>`).join('')}
function renderTray(){let m=M(),items=[...m.sensors,...m.network,...m.actions];$('tray').innerHTML=items.map(x=>`<button class="chip ${Object.values(S.slots).includes(x[0])?'used':''}" data-item="${x[0]}" title="${esc(x[2])}：${esc(x[3])}"><span class="ico">${itemIcon(x[0])}</span><b>${esc(x[2])}</b></button>`).join('')}
function renderRules(){let m=M();if(!S.ran){$('rulesTitle').textContent='② 自己设定触发条件';$('rulesHint').textContent=m.id==='weather'?'雨量＋持续天数为主':'条件不要求背固定数字';m.fields.forEach((f,i)=>{$('rule'+(i?'B':'A')).innerHTML=`<div class="rule-line"><label for="rule-${f.id}">${f.label}</label><input id="rule-${f.id}" type="range" min="${f.min}" max="${f.max}" value="${S.thresholds[f.id]}" data-rule="${f.id}"><output id="value-${f.id}">${S.thresholds[f.id]} ${f.unit}</output></div>`});return}
$('rulesTitle').textContent='③ 这个系统用在什么地方？';$('rulesHint').textContent='各选 1 项，重点说清作用';$('ruleA').innerHTML=`<div class="exit-line"><label for="exitField">应用领域</label><select id="exitField"><option value="">请选择一个领域</option>${FIELD_CHOICES.map((x,i)=>`<option value="${i}" ${S.exitField===String(i)?'selected':''}>${x}</option>`).join('')}</select></div>`;$('ruleB').innerHTML=`<div class="exit-line"><label for="exitRole">主要作用</label><select id="exitRole"><option value="">请选择这个系统的作用</option>${ROLE_CHOICES.map((x,i)=>`<option value="${i}" ${S.exitRole===String(i)?'selected':''}>${x}</option>`).join('')}</select></div>`}
function renderCommand(){let f=S.frame,x=$('status'),problem=diagnostic();let title=f<0?'先选设备，再让现场自动运行':f<3?events[M().id][f]:S.exitChecked?(S.exitCorrect?'✓ 应用领域与作用都答对了':'再想想它解决了什么问题'):S.success?'系统已响应 · 请归纳应用':'系统需调整 · 仍可归纳应用';let sub=f<0?KEY_GUIDE[M().id]:f<3?`场景正在播放 · ${f+1} / 4`:S.exitChecked?(S.exitCorrect?`领域：${FIELD_CHOICES[S.mission]}；作用：${ROLE_CHOICES[S.mission]}`:`正确领域：${FIELD_CHOICES[S.mission]}；作用：${ROLE_CHOICES[S.mission]}`):S.success?'现在选出它的应用领域和主要作用':problem.slice(0,2).join(' · ');x.className='status '+(S.exitChecked?(S.exitCorrect?'ok':'fail'):f===3?(S.success?'ok':'fail'):'');x.innerHTML=`<span class="status-icon">${S.exitChecked?(S.exitCorrect?'🎯':'💡'):f===3?(S.success?'✅':'🔧'):f<0?'🎮':['🔎','📈','⚠'][f]}</span><span><b>${title}</b><small>${sub}</small></span>`;$('dots').innerHTML=[0,1,2,3].map(i=>`<i class="${i<f?'past':i===f?'now':''}"></i>`).join('');$('demoFill').hidden=S.mission!==0;$('nextFrame').disabled=f>=3?!(S.exitField!==''&&S.exitRole!==''):!!S.playing;$('nextFrame').textContent=f>=3?'确认我的归纳':S.playing?'播放中…':'▶ 自动运行';$('autoPlay').disabled=f>=3||!!S.playing;$('autoPlay').textContent='单步';$('progress').textContent=`已完成 ${S.completed.size} / 4 个任务`}
function renderVerdict(){let e=$('verdictPanel');if(!S.ran){e.className='verdict-panel';e.innerHTML='';return}let m=M(),s=m.required.map(id=>shortName(id)).join('＋'),n=shortName(m.networkOK),a=shortName(m.actionOK);e.className='verdict-panel visible '+(S.success?'correct':'wrong');e.innerHTML=`<div class="verdict-head"><strong>${S.success?'✓ 搭建有效':'✕ 搭建待调整'}</strong><span>${S.success?'系统完成有效响应':'现场出现了失败结果'}</span></div><div class="verdict-answer"><b>唯一标准搭建</b><span>感知：${esc(s)}</span><span>传输：${esc(n)}</span><span>应用：平台判断 → ${esc(a)}</span></div>${S.success?'':`<div class="verdict-reason">${esc(diagnostic().join(' · '))}</div>`}`}

const spriteImages={farm:null,industrial:null};let sceneCanvas=null,sceneCtx=null,sceneRunning=false;
function prepareSprites(){if(typeof Image==='undefined')return;for(let [name,src] of [['farm',FARM_SHEET],['industrial',INDUSTRIAL_SHEET]]){if(!spriteImages[name]){let im=new Image();im.src=src;spriteImages[name]=im}}}
function tile(ctx,pack,index,x,y,size=54){let im=spriteImages[pack];if(!im||!im.complete||!im.naturalWidth)return;let col=index%16,row=Math.floor(index/16);ctx.drawImage(im,col*19,row*19,18,18,Math.round(x),Math.round(y),size,size)}
function drawCloud(ctx,x,y,w=90){ctx.fillStyle='#fff7dfb5';ctx.fillRect(x+18,y,w-30,12);ctx.fillRect(x+30,y-12,w-54,12);ctx.fillRect(x,y+12,w,12)}
function drawScene(ms){if(!sceneCtx)return;let c=sceneCtx,m=M(),id=m.id,f=S.frame<0?0:S.frame,fail=S.frame===3&&!S.success,ok=S.frame===3&&S.success,t=ms/1000;c.clearRect(0,0,900,450);c.imageSmoothingEnabled=false;
  let sky=c.createLinearGradient(0,0,0,270);sky.addColorStop(0,fail?'#b95651':f>=2?'#f2a45e':'#8bd0dd');sky.addColorStop(1,fail?'#dd8b66':f>=2?'#f5d598':'#c9e9d0');c.fillStyle=sky;c.fillRect(0,0,900,450);
  drawCloud(c,100+Math.sin(t*.18)*18,60,92);drawCloud(c,385+Math.sin(t*.12)*16,92,75);
  c.fillStyle=f>=2?'#ffe3a2':'#fff1b7';c.beginPath();c.arc(770,76,fail?50:38+Math.sin(t*2)*2,0,Math.PI*2);c.fill();
  c.fillStyle=fail?'#9f7760':'#91bb88';c.beginPath();c.moveTo(0,245);for(let x=0;x<=900;x+=45)c.lineTo(x,208+Math.sin(x/105)*24);c.lineTo(900,300);c.lineTo(0,300);c.fill();
  c.fillStyle=fail?'#806c53':'#6fa877';c.fillRect(0,248,900,202);
  // Farm Expansion tiles: every strip is assembled from individual 18px game tiles.
  const rows=[0,16,32,48],baseY=262;for(let r=0;r<4;r++)for(let col=0;col<17;col++)tile(c,'farm',rows[r]+col%4,col*54,baseY+r*54,54);
  let cropCount=id==='greenhouse'?10:15;
  for(let n=0;n<cropCount;n++){let x=33+n*56,y=208+Math.sin(t*1.5+n*.8)*2;let dry=fail||(f>=2&&(id==='weather'||id==='water'||id==='greenhouse')&&!(ok&&id==='greenhouse'));let idx=dry?104+n%4:(f===0?88+n%4:72+n%4);tile(c,'farm',idx,x,y,54)}
  if(id==='weather'){
    // Industrial Expansion telemetry sign, mast and beacon.
    tile(c,'industrial',73,105,115,66);tile(c,'industrial',74,111,181,66);tile(c,'industrial',41,147,159,56);tile(c,'industrial',ok?65:64,111,78,44);
    if(f>=2){c.fillStyle='#ffc27138';for(let q=0;q<9;q++)c.fillRect((q*113+t*15)%940-40,190+q%3*27,35,6)}
    if(fail){c.strokeStyle='#6b3f2a';c.lineWidth=4;for(let q=0;q<7;q++){let x=75+q*110;c.beginPath();c.moveTo(x,326);c.lineTo(x+18,338);c.lineTo(x-4,350);c.stroke()}}
  }
  if(id==='water'){
    let fill=f===0?76:f===1?52:fail?5:12;c.fillStyle='#4c6269';c.fillRect(74,122,145,158);c.fillStyle='#e1f1e6';c.fillRect(84,132,125,138);c.fillStyle='#4cacc6';c.fillRect(84,270-fill*1.3,125,fill*1.3);c.fillStyle='#315c66';c.font='bold 20px sans-serif';c.fillText('储水箱',107,155);
    tile(c,'industrial',41,253,197,65);tile(c,'industrial',ok?65:64,270,158,38);for(let q=0;q<5;q++)tile(c,'industrial',108,318+q*54,265,54);
    if(ok){c.fillStyle='#164c59d9';c.fillRect(350,160,185,42);c.fillStyle='#d8ffff';c.font='bold 20px sans-serif';c.fillText('停泵 · 已发补水任务',360,188)}
    if(fail){c.fillStyle='#e66b4dbb';for(let q=0;q<8;q++){let x=266+(q%3)*12+Math.sin(t+q)*8,y=177-(t*25+q*17)%95;c.fillRect(x,y,13,13)}tile(c,'industrial',42,335,176,64)}
  }
  if(id==='pest'){
    tile(c,'industrial',73,100,167,62);tile(c,'industrial',74,104,224,62);tile(c,'industrial',41,151,208,55);let count=f===0?2:f===1?4:fail?22:10;
    for(let q=0;q<count;q++){let x=270+(q*67)%580+Math.sin(t*2+q)*16,y=58+(q*41)%150+Math.cos(t*3+q)*9;c.font=(q%3?29:35)+'px sans-serif';c.fillText('🦗',x,y)}
    if(ok){c.strokeStyle='#4ddeb0';c.lineWidth=5;c.setLineDash([13,8]);c.strokeRect(480,164,310,130);c.setLineDash([]);c.fillStyle='#165c4dcf';c.fillRect(577,143,135,32);c.fillStyle='white';c.font='bold 19px sans-serif';c.fillText('分区核查',596,165)}
    if(fail){c.fillStyle='#b8402f7a';c.fillRect(390,170,430,120);for(let q=0;q<7;q++)tile(c,'farm',104+q%4,390+q*56,207,54)}
  }
  if(id==='greenhouse'){
    // The greenhouse is built from 12 separate Farm Expansion roof, glass and wall tiles.
    let sx=510,sy=80,sz=70;for(let row=0;row<3;row++)for(let col=0;col<4;col++)tile(c,'farm',[68,84,100][row]+col,sx+col*sz,sy+row*sz,sz);
    c.save();c.translate(722,195);if(ok)c.rotate(t*5);c.strokeStyle=ok?'#d8fff3':'#91b1ab';c.lineWidth=8;for(let q=0;q<4;q++){c.rotate(Math.PI/2);c.beginPath();c.moveTo(0,0);c.lineTo(0,-32);c.stroke()}c.restore();
    if(ok){c.fillStyle='#376f73a0';c.fillRect(530,92,250,35);c.fillStyle='#8be1dc';for(let q=0;q<8;q++){let x=517+q*29,y=108+Math.sin(t*3+q)*6;c.fillRect(x,y,9,7)}}
    if(fail){c.fillStyle='#ed5b4370';c.fillRect(515,99,265,169);for(let q=0;q<8;q++)tile(c,'farm',104+q%4,520+q*31,235,54)}
  }
  if(fail){c.fillStyle='#9d271a18';c.fillRect(0,0,900,450)}
}
function renderScene(){if(!sceneCanvas){$('scene').innerHTML='<canvas id="sceneCanvas" width="900" height="450" aria-label="动态拼搭的农场场景"></canvas><div id="sceneOutcome" class="scene-outcome"></div>';sceneCanvas=$('sceneCanvas');sceneCtx=sceneCanvas&&sceneCanvas.getContext?sceneCanvas.getContext('2d'):null;prepareSprites();if(sceneCtx&&!sceneRunning&&typeof requestAnimationFrame==='function'){sceneRunning=true;const loop=ms=>{drawScene(ms);requestAnimationFrame(loop)};requestAnimationFrame(loop)}}let e=$('sceneOutcome');if(e){let fail=S.frame===3&&!S.success,ok=S.frame===3&&S.success;e.className='scene-outcome '+(fail?'bad':ok?'good':'');e.textContent=fail?'✕ 现场问题持续':ok?'✓ 现场响应完成':''}if(sceneCtx)drawScene(typeof performance!=='undefined'?performance.now():0)}
function render(){renderNav();renderTitle();renderScene();renderData();renderPath();renderPrompt();renderSteps();renderAssembly();renderTray();renderRules();renderCommand();renderVerdict();bind()}
function advance(){if(S.frame>=3)return;S.stage=3;S.frame++;if(S.frame===3){stopPlay();S.ran=true;S.success=built()&&ruleOK();if(S.success)toast('系统响应成功。接下来归纳应用领域与作用');else toast('系统还有问题。观察失败画面后归纳它的用途')}render()}
function playScene(){if(S.playing)return;if(S.frame>=3)clearRun();S.stage=3;S.playing=setInterval(()=>{advance()},1150);advance()}

function demoFill(){let m=M();S.slots.s0=m.required[0];S.slots.network=m.networkOK;S.slots.action=m.actionOK;S.thresholds=Object.fromEntries(m.fields.map(f=>[f.id,f.value]));clearRun();S.stage=3;render();toast('示范系统已搭好，点击推进现场')}
function bind(){document.querySelectorAll('[data-mission]').forEach(b=>b.onclick=()=>reset(+b.dataset.mission));document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>step(+b.dataset.step));document.querySelectorAll('[data-slot]').forEach(b=>b.onclick=()=>{let key=b.dataset.slot;if(S.slots[key]){S.slots[key]=null;clearRun();S.stage=1;render()}});document.querySelectorAll('[data-item]').forEach(b=>b.onpointerdown=startDrag);document.querySelectorAll('[data-rule]').forEach(r=>{r.oninput=()=>{S.thresholds[r.dataset.rule]=r.value;$('value-'+r.dataset.rule).textContent=r.value+' '+M().fields.find(f=>f.id===r.dataset.rule).unit;clearRun();S.stage=2};r.onchange=()=>render()});$('nextFrame').onclick=()=>S.ran?checkExit():playScene;$('replay').onclick=()=>{clearRun();S.stage=3;render()};$('autoPlay').onclick=advance;$('demoFill').onclick=demoFill;for(let id of ['exitField','exitRole']){let el=$(id);if(el)el.onchange=()=>{S[id]=el.value;S.exitChecked=false;renderCommand()}}}
function checkExit(){if(S.exitField===''||S.exitRole==='')return;S.exitChecked=true;S.exitCorrect=+S.exitField===S.mission&&+S.exitRole===S.mission;if(S.exitCorrect){S.completed.add(S.mission);toast('归纳正确：说出了应用领域和作用')}else toast('再看一眼事件和三层链路');renderCommand()}
let drag=null;
function startDrag(e){if(e.button!==0)return;e.preventDefault();let el=e.currentTarget,id=el.dataset.item,ghost=el.cloneNode(true);ghost.classList.add('drag-ghost');document.body.appendChild(ghost);el.classList.add('dragging');drag={id,ghost,x:e.clientX,y:e.clientY};moveGhost(e.clientX,e.clientY);window.addEventListener('pointermove',onMove);window.addEventListener('pointerup',onUp,{once:true})}
function moveGhost(x,y){if(drag){drag.ghost.style.left=x+12+'px';drag.ghost.style.top=y+12+'px'}}
function onMove(e){if(!drag)return;moveGhost(e.clientX,e.clientY);document.querySelectorAll('[data-slot]').forEach(x=>x.classList.remove('target'));let target=document.elementFromPoint(e.clientX,e.clientY)?.closest('[data-slot]');if(target)target.classList.add('target')}
function onUp(e){window.removeEventListener('pointermove',onMove);if(!drag)return;let {id,ghost,x,y}=drag;let target=document.elementFromPoint(e.clientX,e.clientY)?.closest('[data-slot]');let moved=Math.hypot(e.clientX-x,e.clientY-y)>9;ghost.remove();drag=null;document.querySelectorAll('[data-slot]').forEach(x=>x.classList.remove('target'));if(target)place(id,target.dataset.slot);else if(!moved)autoPlace(id);else toast('把卡片放进上方虚线槽位')}
$('reset').onclick=()=>{reset();toast('当前任务已重置')};$('fullscreen').onclick=()=>document.fullscreenElement?document.exitFullscreen():$('app').requestFullscreen?.();reset(0);
})();
