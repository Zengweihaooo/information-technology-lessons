&lt;style&gt;
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #000206;
  color: #FFFFFF;
  font-family: -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif;
  min-height: 100vh;
  overflow-x: hidden;
}
.container {
  max-width: 1920px;
  margin: 0 auto;
  padding: 20px;
}
/* Header */
.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 16px 24px;
  background: linear-gradient(90deg, rgba(0,128,250,0.08) 0%, transparent 100%);
  border: 1px solid #3D3F42;
  margin-bottom: 20px;
}
.header h1 {
  font-size: 28px;
  font-weight: 700;
  color: #F8F8F8;
  letter-spacing: 4px;
  background: linear-gradient(90deg, #FFFFFF 0%, #0080FA 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.header-right {
  display: flex;
  align-items: center;
  gap: 24px;
}
.class-selector {
  display: flex;
  align-items: center;
  gap: 12px;
}
.class-selector label {
  font-size: 14px;
  color: #ADAEAF;
}
.class-selector select {
  background: #1E1E1E;
  color: #FFFFFF;
  border: 1px solid #3D3F42;
  border-radius: 8px;
  padding: 8px 16px;
  font-size: 15px;
  cursor: pointer;
  outline: none;
  min-width: 140px;
}
.class-selector select:focus {
  border-color: #0080FA;
}
.refresh-info {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  color: #ADAEAF;
}
.refresh-countdown {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: rgba(0,128,250,0.15);
  color: #0080FA;
  font-weight: 700;
  font-size: 14px;
}
.refresh-now {
  background: transparent;
  color: #0080FA;
  border: 1px solid #0080FA;
  border-radius: 8px;
  padding: 6px 14px;
  font-size: 13px;
  cursor: pointer;
  transition: all 0.3s;
}
.refresh-now:hover {
  background: #0080FA;
  color: #000;
}
/* Stats Cards */
.stats-row {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 20px;
  margin-bottom: 20px;
}
.stat-card {
  background: #000206;
  border: 1px solid #3D3F42;
  padding: 20px 24px;
  position: relative;
  overflow: hidden;
}
.stat-card::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  width: 4px;
  height: 100%;
}
.stat-card:nth-child(1)::before { background: #0080FA; }
.stat-card:nth-child(2)::before { background: #01DF8B; }
.stat-card:nth-child(3)::before { background: #F8F8F8; }
.stat-card:nth-child(4)::before { background: linear-gradient(180deg, #0080FA, #01DF8B); }
.stat-label {
  font-size: 13px;
  color: #ADAEAF;
  margin-bottom: 8px;
  letter-spacing: 1px;
}
.stat-value {
  font-size: 42px;
  font-weight: 700;
  line-height: 1;
}
.stat-card:nth-child(1) .stat-value { color: #0080FA; }
.stat-card:nth-child(2) .stat-value { color: #01DF8B; }
.stat-card:nth-child(3) .stat-value { color: #F8F8F8; }
.stat-card:nth-child(4) .stat-value { color: #0080FA; }
.stat-unit {
  font-size: 16px;
  font-weight: 400;
  color: #ADAEAF;
  margin-left: 6px;
}
/* Main Grid */
.main-grid {
  display: grid;
  grid-template-columns: 1fr 1.2fr 1fr;
  gap: 20px;
}
.panel {
  background: #000206;
  border: 1px solid #3D3F42;
  padding: 20px;
}
.panel-title {
  font-size: 16px;
  font-weight: 600;
  color: #F8F8F8;
  margin-bottom: 16px;
  padding-bottom: 12px;
  border-bottom: 1px solid #3D3F42;
  display: flex;
  align-items: center;
  gap: 8px;
}
.panel-title::before {
  content: '';
  width: 4px;
  height: 16px;
  background: #0080FA;
}
/* Submission List */
.submission-list {
  max-height: 520px;
  overflow-y: auto;
}
.submission-list::-webkit-scrollbar { width: 4px; }
.submission-list::-webkit-scrollbar-track { background: #1E1E1E; }
.submission-list::-webkit-scrollbar-thumb { background: #3D3F42; border-radius: 2px; }
.submission-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 0;
  border-bottom: 1px solid rgba(61,63,66,0.5);
  animation: fadeIn 0.5s ease;
}
@keyframes fadeIn {
  from { opacity: 0; transform: translateX(-10px); }
  to { opacity: 1; transform: translateX(0); }
}
.submission-info {
  flex: 1;
}
.submission-name {
  font-size: 15px;
  font-weight: 500;
  color: #FFFFFF;
  margin-bottom: 4px;
}
.submission-meta {
  font-size: 12px;
  color: #ADAEAF;
}
.submission-score {
  font-size: 22px;
  font-weight: 700;
}
.score-high { color: #01DF8B; }
.score-mid { color: #F5A623; }
.score-low { color: #FF5252; }
/* Correct Rate Chart */
.chart-container {
  margin-bottom: 24px;
}
.chart-bar-group {
  margin-bottom: 16px;
}
.chart-bar-label {
  display: flex;
  justify-content: space-between;
  font-size: 13px;
  margin-bottom: 6px;
  color: #ADAEAF;
}
.chart-bar-label span:last-child {
  color: #FFFFFF;
  font-weight: 600;
}
.chart-bar-track {
  background: #1E1E1E;
  height: 24px;
  border-radius: 0;
  position: relative;
  overflow: hidden;
}
.chart-bar-fill {
  height: 100%;
  border-radius: 0;
  transition: width 0.8s ease;
  position: relative;
}
.chart-bar-fill::after {
  content: '';
  position: absolute;
  right: 0;
  top: 0;
  width: 2px;
  height: 100%;
  background: rgba(255,255,255,0.5);
}
.bar-green { background: linear-gradient(90deg, rgba(1,223,139,0.3), #01DF8B); }
.bar-yellow { background: linear-gradient(90deg, rgba(245,166,35,0.3), #F5A623); }
.bar-blue { background: linear-gradient(90deg, rgba(0,128,250,0.3), #0080FA); }
.bar-red { background: linear-gradient(90deg, rgba(255,82,82,0.3), #FF5252); }
/* Class distribution mini */
.class-overview {
  margin-top: 20px;
}
.class-grid {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 8px;
}
.class-cell {
  background: #1E1E1E;
  border: 1px solid #3D3F42;
  padding: 8px 4px;
  text-align: center;
  cursor: pointer;
  transition: all 0.3s;
  font-size: 12px;
}
.class-cell:hover {
  border-color: #0080FA;
  background: rgba(0,128,250,0.1);
}
.class-cell.active {
  border-color: #0080FA;
  background: rgba(0,128,250,0.2);
  box-shadow: 0 0 12px rgba(0,128,250,0.3);
}
.class-cell .class-num {
  font-size: 14px;
  font-weight: 700;
  color: #F8F8F8;
  margin-bottom: 2px;
}
.class-cell .class-count {
  font-size: 11px;
  color: #01DF8B;
}
.class-cell.empty .class-count {
  color: #3D3F42;
}
/* Ranking */
.ranking-list {
  max-height: 520px;
  overflow-y: auto;
}
.ranking-list::-webkit-scrollbar { width: 4px; }
.ranking-list::-webkit-scrollbar-track { background: #1E1E1E; }
.ranking-list::-webkit-scrollbar-thumb { background: #3D3F42; border-radius: 2px; }
.ranking-item {
  display: flex;
  align-items: center;
  padding: 10px 0;
  border-bottom: 1px solid rgba(61,63,66,0.5);
  gap: 12px;
}
.rank-num {
  width: 28px;
  height: 28px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
  font-weight: 700;
  border-radius: 4px;
  background: #1E1E1E;
  color: #ADAEAF;
  flex-shrink: 0;
}
.rank-num.top1 {
  background: linear-gradient(135deg, #FFD700, #FFA500);
  color: #000;
}
.rank-num.top2 {
  background: linear-gradient(135deg, #C0C0C0, #A8A8A8);
  color: #000;
}
.rank-num.top3 {
  background: linear-gradient(135deg, #CD7F32, #B87333);
  color: #000;
}
.rank-info {
  flex: 1;
  min-width: 0;
}
.rank-name {
  font-size: 14px;
  font-weight: 500;
  color: #FFFFFF;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.rank-class {
  font-size: 11px;
  color: #ADAEAF;
  margin-top: 2px;
}
.rank-score {
  font-size: 18px;
  font-weight: 700;
  color: #F8F8F8;
  flex-shrink: 0;
}
.rank-correct {
  font-size: 11px;
  color: #ADAEAF;
  text-align: right;
  flex-shrink: 0;
}
/* Empty state */
.empty-state {
  text-align: center;
  padding: 40px 20px;
  color: #3D3F42;
  font-size: 14px;
}
/* Loading */
.loading-overlay {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: rgba(0,2,6,0.9);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 1000;
  flex-direction: column;
  gap: 16px;
}
.loading-spinner {
  width: 40px;
  height: 40px;
  border: 3px solid #1E1E1E;
  border-top-color: #0080FA;
  border-radius: 50%;
  animation: spin 1s linear infinite;
}
@keyframes spin {
  to { transform: rotate(360deg); }
}
.loading-text {
  color: #ADAEAF;
  font-size: 14px;
}
/* Update pulse */
.update-indicator {
  display: inline-block;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #01DF8B;
  animation: pulse 2s infinite;
}
@keyframes pulse {
  0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(1,223,139,0.7); }
  50% { opacity: 0.7; box-shadow: 0 0 0 6px rgba(1,223,139,0); }
}
.error-msg {
  color: #FF5252;
  font-size: 13px;
  padding: 20px;
  text-align: center;
}
&lt;/style&gt;

&lt;script&gt;
const API_URL = 'https://quickform.cn/api/cbb4omh8jq/all';
const REFRESH_INTERVAL = 2;
let allData = { submissions: [], total_submissions: 0 };
let selectedClass = 'all';
let countdown = REFRESH_INTERVAL;
let timer = null;
let countdownTimer = null;

// Init class selector (1-20)
function initClassSelector() {
  const select = document.getElementById('classSelect');
  // 清理预渲染静态快照中的旧选项，确保页面运行时只有&ldquo;全部班级&rdquo;和1&mdash;20班。
  select.innerHTML = '&lt;option value=&quot;all&quot;&gt;全部班级&lt;/option&gt;';
  for (let i = 1; i &lt;= 20; i++) {
    const opt = document.createElement('option');
    opt.value = String(i);
    opt.textContent = i + '班';
    select.appendChild(opt);
  }
  select.addEventListener('change', (e) =&gt; {
    selectedClass = e.target.value;
    renderAll();
    highlightClassGrid();
  });
}

// Fetch data from API
async function fetchData() {
  try {
    const res = await fetch(API_URL);
    if (!res.ok) throw new Error('Network error');
    const data = await res.json();
    allData = data;
    document.getElementById('refreshStatus').textContent = '实时更新中';
    renderAll();
    renderClassGrid();
  } catch (err) {
    console.error('Fetch error:', err);
    document.getElementById('refreshStatus').textContent = '连接异常，重试中';
  }
  countdown = REFRESH_INTERVAL;
  document.getElementById('loading').style.display = 'none';
}

// Get filtered submissions
function getFiltered() {
  if (selectedClass === 'all') return allData.submissions;
  return allData.submissions.filter(s =&gt; {
    const cn = String(s.class);
    // 匹配后两位数字，兼容 &quot;01&quot; 和 &quot;2501&quot; 两种格式
    const numPart = cn.replace(/^0+/, '') || '0';
    const suffix = cn.slice(-2).replace(/^0+/, '');
    return numPart === selectedClass || suffix === selectedClass || cn === String(selectedClass).padStart(2,'0');
  });
}

// Format time
function formatTime(isoStr) {
  const d = new Date(isoStr);
  const now = new Date();
  const diff = Math.floor((now - d) / 1000);
  if (diff &lt; 60) return diff + '秒前';
  if (diff &lt; 3600) return Math.floor(diff/60) + '分钟前';
  return d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0');
}

// Score color
function getScoreColor(score, total=100) {
  const rate = total &gt; 0 ? score/total : 0;
  if (rate &gt;= 0.8) return 'score-high';
  if (rate &gt;= 0.6) return 'score-mid';
  return 'score-low';
}

// Render all
function renderAll() {
  const submissions = getFiltered();
  
  // Stats
  const count = submissions.length;
  document.getElementById('totalCount').innerHTML = count + '&lt;span class=&quot;stat-unit&quot;&gt;人&lt;/span&gt;';
  
  if (count &gt; 0) {
    const totalScorePer = submissions[0].total ? (100/submissions[0].total) : 20;
    const avgCorrect = submissions.reduce((sum,s) =&gt; sum + s.correct, 0) / count;
    const totalQuestions = submissions[0].answers ? submissions[0].answers.length : 5;
    const avgRate = ((avgCorrect / totalQuestions) * 100).toFixed(1);
    const avgScore = submissions.reduce((sum,s) =&gt; sum + (s.score||0), 0) / count;
    const maxScore = Math.max(...submissions.map(s =&gt; s.score||0));
    
    document.getElementById('avgRate').innerHTML = avgRate + '&lt;span class=&quot;stat-unit&quot;&gt;%&lt;/span&gt;';
    document.getElementById('avgScore').innerHTML = avgScore.toFixed(1) + '&lt;span class=&quot;stat-unit&quot;&gt;分&lt;/span&gt;';
    document.getElementById('maxScore').innerHTML = maxScore + '&lt;span class=&quot;stat-unit&quot;&gt;分&lt;/span&gt;';
  } else {
    document.getElementById('avgRate').innerHTML = '0&lt;span class=&quot;stat-unit&quot;&gt;%&lt;/span&gt;';
    document.getElementById('avgScore').innerHTML = '0&lt;span class=&quot;stat-unit&quot;&gt;分&lt;/span&gt;';
    document.getElementById('maxScore').innerHTML = '0&lt;span class=&quot;stat-unit&quot;&gt;分&lt;/span&gt;';
  }

  // Submission list (latest 15, newest first)
  const sorted = [...submissions].sort((a,b) =&gt; new Date(b.submitTime) - new Date(a.submitTime));
  const listEl = document.getElementById('submissionList');
  if (sorted.length === 0) {
    listEl.innerHTML = '&lt;div class=&quot;empty-state&quot;&gt;' + (selectedClass==='all'?'暂无提交数据':selectedClass+'班暂无提交') + '&lt;/div&gt;';
  } else {
    listEl.innerHTML = sorted.slice(0, 15).map(s =&gt; {
      const totalQ = s.answers ? s.answers.length : s.total;
      const scoreColor = getScoreColor(s.correct, totalQ);
      const displayScore = s.score != null ? s.score : Math.round(s.correct/totalQ*100);
      return `
        &lt;div class=&quot;submission-item&quot;&gt;
          &lt;div class=&quot;submission-info&quot;&gt;
            &lt;div class=&quot;submission-name&quot;&gt;${s.name || '匿名'}&lt;/div&gt;
            &lt;div class=&quot;submission-meta&quot;&gt;${s.class}班 &middot; 学号${s.studentId} &middot; ${formatTime(s.submitTime)}&lt;/div&gt;
          &lt;/div&gt;
          &lt;div class=&quot;submission-score ${scoreColor}&quot;&gt;${displayScore}分&lt;/div&gt;
        &lt;/div&gt;
      `;
    }).join('');
  }

  // Correct rate per question
  renderChart(submissions);

  // Ranking
  renderRanking(submissions);
}

// Render chart
function renderChart(submissions) {
  const chartEl = document.getElementById('chartContainer');
  if (submissions.length === 0) {
    chartEl.innerHTML = '&lt;div class=&quot;empty-state&quot;&gt;暂无答题数据&lt;/div&gt;';
    return;
  }
  const questionCount = submissions[0].answers ? submissions[0].answers.length : 5;
  let html = '';
  for (let q = 0; q &lt; questionCount; q++) {
    const correct = submissions.filter(s =&gt; s.answers &amp;&amp; s.answers[q] === 1).length;
    const rate = submissions.length &gt; 0 ? (correct / submissions.length * 100) : 0;
    const barClass = rate &gt;= 80 ? 'bar-green' : rate &gt;= 60 ? 'bar-blue' : rate &gt;= 40 ? 'bar-yellow' : 'bar-red';
    html += `
      &lt;div class=&quot;chart-bar-group&quot;&gt;
        &lt;div class=&quot;chart-bar-label&quot;&gt;
          &lt;span&gt;第 ${q+1} 题&lt;/span&gt;
          &lt;span&gt;${rate.toFixed(1)}% (${correct}/${submissions.length})&lt;/span&gt;
        &lt;/div&gt;
        &lt;div class=&quot;chart-bar-track&quot;&gt;
          &lt;div class=&quot;chart-bar-fill ${barClass}&quot; style=&quot;width: ${rate}%&quot;&gt;&lt;/div&gt;
        &lt;/div&gt;
      &lt;/div&gt;
    `;
  }
  chartEl.innerHTML = html;
}

// Render ranking
function renderRanking(submissions) {
  const rankEl = document.getElementById('rankingList');
  if (submissions.length === 0) {
    rankEl.innerHTML = '&lt;div class=&quot;empty-state&quot;&gt;' + (selectedClass==='all'?'暂无排名数据':selectedClass+'班暂无排名') + '&lt;/div&gt;';
    return;
  }
  const ranked = [...submissions].sort((a,b) =&gt; {
    const scoreA = a.score != null ? a.score : Math.round(a.correct/(a.answers?a.answers.length:a.total)*100);
    const scoreB = b.score != null ? b.score : Math.round(b.correct/(b.answers?b.answers.length:b.total)*100);
    if (scoreB !== scoreA) return scoreB - scoreA;
    return new Date(a.submitTime) - new Date(b.submitTime);
  });
  const totalQ = submissions[0].answers ? submissions[0].answers.length : (submissions[0].total||5);
  rankEl.innerHTML = ranked.map((s, i) =&gt; {
    const score = s.score != null ? s.score : Math.round(s.correct/totalQ*100);
    let rankClass = '';
    if (i === 0) rankClass = 'top1';
    else if (i === 1) rankClass = 'top2';
    else if (i === 2) rankClass = 'top3';
    return `
      &lt;div class=&quot;ranking-item&quot;&gt;
        &lt;div class=&quot;rank-num ${rankClass}&quot;&gt;${i+1}&lt;/div&gt;
        &lt;div class=&quot;rank-info&quot;&gt;
          &lt;div class=&quot;rank-name&quot;&gt;${s.name || '匿名'}&lt;/div&gt;
          &lt;div class=&quot;rank-class&quot;&gt;${s.class}班 &middot; 学号${s.studentId}&lt;/div&gt;
        &lt;/div&gt;
        &lt;div&gt;
          &lt;div class=&quot;rank-score&quot;&gt;${score}&lt;/div&gt;
          &lt;div class=&quot;rank-correct&quot;&gt;${s.correct}/${totalQ}题&lt;/div&gt;
        &lt;/div&gt;
      &lt;/div&gt;
    `;
  }).join('');
}

// Render class grid
function renderClassGrid() {
  const gridEl = document.getElementById('classGrid');
  const classCounts = {};
  for (let i = 1; i &lt;= 20; i++) {
    classCounts[i] = 0;
  }
  allData.submissions.forEach(s =&gt; {
    const cn = String(s.class);
    // 提取班号（后两位转数字）
    let classNum = parseInt(cn.slice(-2), 10);
    if (isNaN(classNum) || classNum &lt; 1 || classNum &gt; 20) {
      classNum = parseInt(cn, 10);
    }
    if (classNum &gt;= 1 &amp;&amp; classNum &lt;= 20) {
      classCounts[classNum]++;
    }
  });
  let html = '';
  for (let i = 1; i &lt;= 20; i++) {
    const count = classCounts[i];
    const isActive = selectedClass === String(i);
    html += `
      &lt;div class=&quot;class-cell ${count===0?'empty':''} ${isActive?'active':''}&quot; data-class=&quot;${i}&quot; onclick=&quot;selectClass('${i}')&quot;&gt;
        &lt;div class=&quot;class-num&quot;&gt;${i}&lt;/div&gt;
        &lt;div class=&quot;class-count&quot;&gt;${count}人&lt;/div&gt;
      &lt;/div&gt;
    `;
  }
  gridEl.innerHTML = html;
}

function selectClass(cn) {
  selectedClass = cn;
  document.getElementById('classSelect').value = cn;
  renderAll();
  highlightClassGrid();
}

function highlightClassGrid() {
  document.querySelectorAll('.class-cell').forEach(cell =&gt; {
    cell.classList.remove('active');
    if (cell.dataset.class === selectedClass) {
      cell.classList.add('active');
    }
  });
}

// Countdown
function startCountdown() {
  countdown = REFRESH_INTERVAL;
  if (countdownTimer) clearInterval(countdownTimer);
  countdownTimer = setInterval(() =&gt; {
    countdown--;
    document.getElementById('countdown').textContent = countdown;
    if (countdown &lt;= 0) {
      fetchData();
    }
  }, 1000);
}

// Init
function init() {
  initClassSelector();
  fetchData();
  startCountdown();
}

init();
&lt;/script&gt;
