<!doctype html><meta charset="utf-8"><title>智慧温室 MQTT 云平台模拟器</title><style>body{margin:0;background:#0d211d;color:#eafff3;font-family:system-ui,'PingFang SC'}header{padding:24px 6vw;background:#176b4d}main{max-width:1200px;margin:auto;padding:22px}.grid{display:grid;grid-template-columns:1.2fr 1fr;gap:18px}.card{background:#173b34;border:1px solid #2e6b58;border-radius:16px;padding:20px;margin-bottom:18px}h1{font-size:clamp(28px,4vw,48px);margin:0}h2{color:#8ee0ba}button,select{padding:10px 14px;border:0;border-radius:9px;margin:5px;background:#3baa82;color:#fff;font-size:16px;cursor:pointer}input{padding:10px;border-radius:8px;border:1px solid #559b7d;background:#0d211d;color:white;width:90%}.metric{font-size:28px;font-weight:700}.warn{color:#ffd36b}.log{height:150px;overflow:auto;background:#091713;padding:10px;border-radius:8px;font-family:monospace}.topic{color:#8ee0ba}.node{display:inline-block;background:#285e4a;padding:14px;margin:7px;border-radius:10px}.ok{color:#82e6a9}.bad{color:#ff9d8e}</style><header><h1>智慧温室 MQTT 云平台模拟器</h1><p>你是值班工程师：观察数据、发布消息、配置规则、控制设备。</p></header><main><div class="grid"><section><div class="card"><h2>实时温室</h2><p>温度 <span class="metric" id="temp">33.8</span> °C　湿度 <span class="metric" id="hum">28</span> %　光照 <span class="metric" id="light">76</span> klx</p><button onclick="tick()">采集一轮数据</button><button onclick="toggle()">启动自动模式</button><p id="state" class="warn">当前：人工观察</p></div><div class="card"><h2>MQTT 发布 / 订阅</h2><p>主题：<input id="topic" value="greenhouse/1/humidity"></p><p>消息：<input id="msg" value='{"value":28,"unit":"%"}'></p><button onclick="publish()">发布消息</button><div class="log" id="log"></div></div><div class="card"><h2>控制台</h2><div class="node">温湿度传感器</div>→<div class="node">MQTT Broker</div>→<div class="node">云平台规则</div>→<div class="node">电磁阀 / 风机</div><p id="act">执行设备：待命</p></div></section><aside><div class="card"><h2>规则引擎</h2><p>当湿度低于 <input id="threshold" type="number" value="35" style="width:70px"> %</p><button onclick="applyRule()">运行规则</button><p id="ruleout"></p></div><div class="card"><h2>工程师任务</h2><p>选择正确的 MQTT 说法：</p><div id="quiz"></div><p id="feedback"></p></div><div class="card"><h2>主题设计器</h2><p>组合一个清晰的主题：</p><select id="place"><option>greenhouse</option><option>classroom</option></select><select id="unit"><option>1</option><option>2</option></select><select id="data"><option>temperature</option><option>humidity</option><option>light</option><option>valve</option></select><button onclick="makeTopic()">生成主题</button><p class="topic" id="made"></p></div><div class="card"><h2>学习记录</h2><p id="record">已完成 0 个任务</p><button onclick="resetAll()">重新开始</button></div></aside></div></main><script>let auto=false,done=0;const log=document.querySelector('#log');function write(x){log.innerHTML='<div>'+new Date().toLocaleTimeString()+' '+x+'</div>'+log.innerHTML}function tick(){let t=(25+Math.random()*12).toFixed(1),h=Math.round(20+Math.random()*45),l=Math.round(40+Math.random()*50);temp.textContent=t;hum.textContent=h;light.textContent=l;write('<span class=topic>greenhouse/1/temperature</span> '+t);write('<span class=topic>greenhouse/1/humidity</span> '+h);if(auto)applyRule()}function toggle(){auto=!auto;state.textContent=auto?'当前：自动模式，每 2 秒采集':'当前：人工观察';if(auto)window.loop=setInterval(tick,2000);else clearInterval(window.loop)}function publish(){write('<span class=topic>'+topic.value+'</span> '+msg.value);doneTask()}function applyRule(){let h=+hum.textContent,th=+threshold.value;if(h<th){act.textContent='执行设备：电磁阀 ON，开始灌溉';ruleout.innerHTML='<span class=ok>规则命中：湿度 '+h+'% < '+th+'%</span>';write('发布 <span class=topic>greenhouse/1/valve</span> ON')}else{act.textContent='执行设备：待命';ruleout.textContent='规则未命中，继续监测'}doneTask()}function makeTopic(){made.textContent=place.value+'/'+unit.value+'/'+data.value;doneTask()}function doneTask(){done=Math.min(4,done+1);record.textContent='已完成 '+done+' 个任务'}let qs=['MQTT 只能点对点传输','MQTT 用主题组织发布和订阅','MQTT 不需要网络'];qs.forEach((q,i)=>{let b=document.createElement('button');b.textContent=q;b.onclick=()=>{feedback.textContent=i===1?'正确：订阅者通过主题收到消息':'再想想：课本强调发布、订阅和主题';if(i===1)doneTask()};quiz.appendChild(b)});function resetAll(){location.reload()}</script>
