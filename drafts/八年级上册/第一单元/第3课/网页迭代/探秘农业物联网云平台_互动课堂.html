<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>探秘农业物联网云平台</title><style>body{margin:0;font-family:Arial,'PingFang SC',sans-serif;background:#eff8f2;color:#173b34}header{background:#176b4d;color:white;padding:24px 7vw}h1{margin:0;font-size:clamp(28px,4vw,48px)}main{max-width:1100px;margin:24px auto;padding:0 18px}.panel{background:white;border-radius:18px;padding:24px;margin:18px 0;box-shadow:0 6px 20px #1c604018}button,.choice{border:0;border-radius:12px;padding:12px 18px;background:#3baa82;color:white;font-size:17px;cursor:pointer;margin:6px}.choice{background:#e0f2e8;color:#176b4d}.choice.correct{background:#f4c95d}.choice.wrong{background:#f6b5a8}.flow{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center;margin:20px 0}.node{padding:18px 20px;border-radius:14px;background:#dff2e8;border:2px solid #3baa82;min-width:130px;text-align:center;font-weight:bold}.arrow{font-size:28px;color:#3baa82}.meter{height:18px;background:#d8ebe0;border-radius:9px;overflow:hidden}.fill{height:100%;width:35%;background:#f4c95d;transition:.4s}.score{font-weight:bold;color:#176b4d}</style><header><h1>探秘农业物联网云平台</h1><p>第 3 课｜小小农业工程师互动课堂</p></header><main><section class="panel"><h2>任务 1：让数据找到家</h2><p>点击正确的数据流顺序：</p><div id="q1"></div><div id="r1"></div></section><section class="panel"><h2>任务 2：MQTT 消息怎么走</h2><p>选择最合适的说法：</p><div id="q2"></div><div id="r2"></div></section><section class="panel"><h2>任务 3：云平台做决定</h2><p>温室湿度只有 25%，系统应该优先做什么？</p><div id="q3"></div><div id="r3"></div></section><section class="panel"><h2>任务 4：完成你的思维导图</h2><p>点击关键词，把它们加入中心主题。</p><div id="map"><div class="node" style="background:#176b4d;color:white">农业物联网云平台</div></div><div id="words"></div></section><section class="panel"><h2>课堂得分</h2><p class="score" id="score">0 / 4</p><div class="meter"><div class="fill" id="fill"></div></div><p id="end"></p></section></main><script>let score=0,done={};function render(id,items,key,out){let el=document.getElementById(id);items.forEach((x,i)=>{let b=document.createElement('button');b.className='choice';b.textContent=x;b.onclick=()=>{if(done[key])return;done[key]=1;let ok=(key==='q1'?i===0:key==='q2'?i===1:i===0);b.classList.add(ok?'correct':'wrong');document.getElementById(out).textContent=ok?'答对了！':'再想一想：回顾课本中的流程。';if(ok){score++;document.getElementById('score').textContent=score+' / 4';document.getElementById('fill').style.width=(score*25+35)+'%';if(score===4)document.getElementById('end').textContent='任务完成！你已经掌握农业物联网云平台的基本原理。'}};el.appendChild(b)})}render('q1',['传感器 → 网络传输 → 云平台 → 执行设备','云平台 → 传感器 → 执行设备 → 网络传输'],'q1','r1');render('q2',['MQTT 只能让两个设备直接连接','MQTT 使用发布 / 订阅，设备通过主题交换消息','MQTT 只用于播放音乐'],'q2','r2');render('q3',['启动灌溉并继续监测湿度','关闭所有传感器','只显示数据但不采取行动'],'q3','r3');let ws=['数据采集','网络传输','平台分析','MQTT','发布 / 订阅','智能灌溉'];let we=document.getElementById('words');ws.forEach(w=>{let b=document.createElement('button');b.className='choice';b.textContent=w;b.onclick=()=>{let n=document.createElement('div');n.className='node';n.textContent=w;document.getElementById('map').appendChild(n);b.disabled=true}});we.appendChild(b)})</script></html>
